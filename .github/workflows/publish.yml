name: Publish to npm

# Trusted Publishing (OIDC) - no NPM_TOKEN, nothing to expire, no 2FA prompt.
# npm mints a short-lived credential from GitHub's OIDC identity and verifies
# this exact repo + workflow, so there is no long-lived secret to leak or renew.
#
# This exists because the previous setup had a token that silently expired
# ~2026-06-04 and only surfaced two months later as an unexplained 401, then a
# 403 demanding an OTP. Tokens that expire quietly are the failure mode; this
# removes them.
#
# One-time setup on npmjs.com (already done if publishes are working):
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#   Repository: RegistrumUK/uk-companies-house-mcp   Workflow: publish.yml
#
# Run it with:  gh workflow run publish.yml --repo RegistrumUK/uk-companies-house-mcp

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for OIDC. Without it npm falls back to looking for a token
      # and the publish fails with a confusing auth error.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # NOTE: deliberately no `registry-url`. Setting it makes setup-node write
      # a temp .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and export
      # NODE_AUTH_TOKEN as a placeholder. npm then sends the literal string
      # "XXXXX-XXXXX-XXXXX-XXXXX" as credentials instead of performing the OIDC
      # exchange, and the registry rejects it as anonymous - surfacing as a
      # baffling `E404 Not Found - PUT` on a package that plainly exists.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1; the version bundled with the
      # runner's Node is older, so upgrade explicitly rather than hope.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - run: npm ci
      - run: npm run build

      # Guards that the published artifact is sane: server.json/package.json
      # version sync, mcpName matching, and every signup link carrying a utm
      # tag. prepublishOnly runs these too, but failing here is cheaper.
      - run: npm test

      # Tolerate "this version already exists", but nothing else.
      #
      # The registry publish below is a separate call that can fail on its own
      # (it 422s on a description over 100 chars, for instance). When that
      # happened on 2.0.1 the npm artifact was already live, so the only way to
      # retry the registry was to burn another version number - npm refuses to
      # republish one. Now a re-run reaches the registry step regardless, and
      # any npm failure that is NOT a duplicate still fails the job.
      - name: Publish to npm
        run: |
          set -o pipefail
          if npm publish --access public; then
            echo "published"
          else
            v="$(node -p "require('./package.json').version")"
            if npm view "@registrum/mcp@$v" version >/dev/null 2>&1; then
              echo "npm already has $v - continuing so the registry step can run"
            else
              echo "npm publish failed for a reason other than a duplicate version" >&2
              exit 1
            fi
          fi

      # The MCP registry is a second, separate publish - npm hosts the artifact,
      # the registry only hosts metadata pointing at it. Keeping them in one
      # workflow is what stops server.json drifting behind npm again (it sat at
      # v1.0.2 against npm's v1.2.0 for five months).
      #
      # github-oidc uses the same short-lived identity as the npm step, so there
      # is no device code to enter. Doing this by hand meant re-authenticating
      # every time, because the registry JWT expires in minutes.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"             | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # npm's publish response returns before the new version is indexed, so
      # the registry's own validation against npm 404s if we hit it right
      # away ("A newly published release can take a moment to appear on the
      # registry. Wait and retry" - its own error message, verbatim, on the
      # v2.0.9 run that failed here on 2026-10-04). Retry instead of relying
      # on a human re-running the job.
      - name: Publish to the MCP registry
        run: |
          # npm took 1-5 minutes to serve 2.0.9 and 2.0.10, longer than five
          # 15s retries; wait for the version itself before registering it.
          v="$(node -p "require('./package.json').version")"
          for wait in $(seq 1 40); do
            npm view "@registrum/mcp@$v" version >/dev/null 2>&1 && break
            echo "npm does not serve $v yet (check $wait/40), waiting 15s"
            sleep 15
          done
          # Log in only now, inside the retry loop. The registry JWT lives a few
          # minutes and the wait above ran ~20 minutes on 2.0.12, so a login done
          # before it expired and publish failed 401 (#33). One fresh token per
          # attempt.
          for attempt in 1 2 3 4 5; do
            if mcp-publisher login github-oidc && mcp-publisher publish; then
              exit 0
            fi
            echo "mcp-publisher login/publish failed (attempt $attempt/5) - npm may not have indexed the new version yet, retrying in 15s"
            sleep 15
          done
          exit 1

      # This repo published tags for every version (v1.0.1 .. v2.0.5) but
      # never once created a GitHub Release object - a different thing from
      # a tag, and the thing external directories actually read. Glama's
      # listing showed "Latest release: v1.0.2" for five versions straight
      # because of exactly this gap (found 2026-08-28, fixed by hand for
      # v2.0.5: github.com/vdmeu/registrum-mcp/releases/tag/v2.0.5). This
      # closes it at the source instead of needing another manual catch-up.
      - name: Create a GitHub Release for this tag
        # workflow_dispatch can run on a branch, not just a tag push - only
        # attempt this when there's an actual tag to attach the release to.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$tag"
          fi
