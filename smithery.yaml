# Smithery MCP registry configuration
# https://smithery.ai
#
# Declared as a hosted, remote server with NO required configuration. That is
# the whole point: the anonymous endpoint needs no account, no API key and no
# local install, which is the step where most people dropped out.
#
# The npm/stdio package still exists for anyone who wants their own key or to
# run the server locally - see README - but it is not what a directory listing
# should lead with.

name: "UK Companies House due diligence and KYB (Registrum)"
description: >
  UK company due diligence and KYB on live Companies House data, hosted, with
  no API key and no account. Trace ownership to the beneficial owners, pull
  director histories and appointment networks, check ECCTA identity-verification
  status and each person's own deadline, and read financials parsed from iXBRL
  accounts. Search companies by name, or make one bundle call that returns
  profile, compliance, financials, PSCs and directors together for a single
  credit instead of five. Also answers ChatGPT search and fetch. No Companies
  House developer key, no rate-limit handling, no iXBRL parsing. Try every tool
  anonymously; add a free Registrum key when you want to build on it.

startCommand:
  type: http
  url: https://registrum.co.uk/api/mcp
  configSchema:
    type: object
    properties: {}
    required: []
